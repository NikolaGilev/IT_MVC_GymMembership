## StatefulSet for database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gym-db
  namespace: gym-app
spec:
  serviceName: "gym-db"
  replicas: 1
  selector:
    matchLabels:
      app: gym-db
  template:
    metadata:
      labels:
        app: gym-db
    spec:
      containers:
      - name: gym-db
        image: mcr.microsoft.com/mssql/server:2019-latest
        ports:
        - containerPort: 1433
        envFrom:
        - secretRef:
            name: db-secret
  volumeClaimTemplates:
  - metadata:
      name: gym-db-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
