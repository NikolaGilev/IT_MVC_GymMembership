<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /app
    MonoServerPath gym-app "/usr/bin/mod-mono-server4"
    MonoApplications gym-app "/:/app"
    <Location "/">
        AllowOverride All
        Order allow,deny
        Allow from all
        SetHandler mono
        MonoSetServerAlias gym-app
    </Location>
</VirtualHost>
